<!DOCTYPE html>
<html>
<head>
    <title>Track Shipment - Smart Logistics</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            margin: 0;
            padding: 0;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            width: 500px;
            margin-bottom: 20px;
        }

        h3 {
            margin-bottom: 20px;
            color: #2a5298;
        }

        input {
            padding: 12px;
            margin: 8px 0;
            width: 100%;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.2s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #2a5298;
            box-shadow: 0 0 5px rgba(42,82,152,0.3);
        }

        button {
            padding: 12px 24px;
            margin-top: 20px;
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
        }

        button:hover {
            background: linear-gradient(to right, #5b86e5, #36d1dc);
            transform: scale(1.02);
        }

        .back-link {
            margin-top: 20px;
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid white;
            border-radius: 6px;
            transition: 0.3s;
        }

        .back-link:hover {
            background: white;
            color: #2a5298;
        }

        .result-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            width: 500px;
            text-align: left;
            display: none;
        }

        .result-card h4 {
            color: #2a5298;
            margin-bottom: 10px;
        }

        .status-info {
            margin-bottom: 15px;
        }

        .logs {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #2a5298;
        }

        .log-entry {
            margin-bottom: 10px;
            padding: 8px;
            background: white;
            border-radius: 4px;
            border: 1px solid #e9ecef;
        }

        .log-status {
            font-weight: bold;
            color: #2a5298;
        }

        .log-time {
            color: #666;
            font-size: 12px;
        }

        .agent-info {
            color: #28a745;
            font-size: 14px;
        }
    </style>
</head>

<body>

<h1>Track Shipment</h1>

<div class="card">
    <h3>Enter Shipment ID</h3>
    <input id="trackId" placeholder="Shipment ID" type="number" required>
    <button onclick="track()">Track Shipment</button>
</div>

<div class="result-card" id="result">
    <h4>Shipment Details</h4>
    <div class="status-info" id="statusInfo"></div>
    <div class="logs" id="logs"></div>
</div>

<a href="index.html" class="back-link">← Back to Home</a>

<script>
function track() {
    const id = document.getElementById('trackId').value.trim();

    if (!id) {
        alert('Please enter a shipment ID.');
        return;
    }

    fetch(`/tracking/${id}`)
    .then(res => {
        if (!res.ok) {
            throw new Error('Shipment not found');
        }
        return res.json();
    })
    .then(data => {
        displayResult(data);
    })
    .catch(err => {
        alert('Error: ' + err.message);
    });
}

function displayResult(data) {
    const resultDiv = document.getElementById('result');
    const statusInfo = document.getElementById('statusInfo');
    const logsDiv = document.getElementById('logs');

    // Shipment info
    statusInfo.innerHTML = `
        <strong>ID:</strong> ${data.id}<br>
        <strong>Source:</strong> ${data.sourceAddress}<br>
        <strong>Destination:</strong> ${data.destinationAddress}<br>
        <strong>Current Status:</strong> ${data.status}<br>
        ${data.agent ? `<strong>Assigned Agent:</strong> ${data.agent.name} (${data.agent.phone})` : '<strong>Agent:</strong> Not assigned yet'}
    `;

    // Logs
    if (data.logs && data.logs.length > 0) {
        logsDiv.innerHTML = '<h5>Status History:</h5>';
        data.logs.forEach(log => {
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `
                <div class="log-status">${log.status}</div>
                <div class="log-time">${new Date(log.timestamp).toLocaleString()}</div>
                ${data.agent && ['PickedUp', 'InTransit', 'OutForDelivery', 'Delivered'].includes(log.status) ? `<div class="agent-info">Agent: ${data.agent.name} - Phone: ${data.agent.phone}</div>` : ''}
            `;
            logsDiv.appendChild(logEntry);
        });
    } else {
        logsDiv.innerHTML = '<p>No status logs available.</p>';
    }

    resultDiv.style.display = 'block';
}
</script>

</body>
</html>
